<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Tryvoga</title>
<style>
:root{--bg:#0b0e13;--panel:#12171f;--line:#232b37;--text:#e8edf4;--muted:#8793a3;--safe:#1c2531;--safe-h:#263243;--alert:#e5251f;--alert-h:#ff4a42;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.04em;font-size:18px}
.brand span{color:var(--alert)}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#2fbf71}
.dot.on{background:var(--alert);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,37,31,.7)}100%{box-shadow:0 0 0 12px rgba(229,37,31,0)}}
main{display:flex;gap:16px;padding:16px;align-items:stretch}
.mapwrap{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;padding:8px}
svg{width:100%;height:auto;display:block}
.reg{fill-rule:evenodd;fill:var(--safe);stroke:#0b0e13;stroke-width:1.4;stroke-linejoin:round;cursor:pointer;transition:fill .2s}
.reg:hover{fill:var(--safe-h)}
.reg.alert{fill:var(--alert);animation:glow 1.6s ease-in-out infinite}
.reg.alert:hover{fill:var(--alert-h)}
@keyframes glow{0%,100%{fill:var(--alert)}50%{fill:#b81914}}
.reg.warn{fill:#f2c200}
.reg.warn:hover{fill:#ffd84a}
.item.warn{border-left-color:#f2c200}
.tip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;display:none;white-space:nowrap;backdrop-filter:blur(4px)}
aside{width:300px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 110px);min-height:320px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{background:var(--safe);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover{background:var(--safe-h)}
button.red{background:var(--alert);border-color:var(--alert)}
button.red:hover{background:var(--alert-h)}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#list{overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:8px;background:var(--safe);border-left:3px solid var(--alert);font-size:14px;cursor:pointer}
.item small{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}
@media(max-width:860px){main{flex-direction:column}aside{width:100%;max-height:none}}
</style>
</head>
<body>
<header>
<div class="brand">PROJECT <span>TRYVOGA</span></div>

<button id="all">All</button>

</div>
<div class="hint">Click a region: first click red, second click yellow, third click clears. Random mixes both levels.</div>

<div id="list"></div>
</aside>

function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;
return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function render(){
var list=document.getElementById("list"),n=0;list.innerHTML="";
data.forEach(function(r){
r.el.setAttribute("class","reg"+(r.on===1?" alert":r.on===2?" warn":""));
if(r.on){n++;
var d=document.createElement("div");d.className="item"+(r.on===2?" warn":"");
var a=document.createElement("span");a.textContent=r.name;
var b=document.createElement("small");b.textContent=fmt(Date.now()-r.since);r.timer=b;
d.appendChild(a);d.appendChild(b);d.onclick=function(){toggle(r)};list.appendChild(d)}
});
if(!n){var e=document.createElement("div");e.className="empty";e.textContent="All clear. Click the map to add alerts.";list.appendChild(e)}
document.getElementById("count").textContent=n?n+" active alert"+(n>1?"s":""):"No active alerts";
document.getElementById("dot").className="dot"+(n?" on":"");
}
document.getElementById("clear").onclick=function(){data.forEach(function(r){r.on=false});render()};
document.getElementById("all").onclick=function(){data.forEach(function(r){if(!r.on){r.on=1;r.since=Date.now()}});render()};
document.getElementById("random").onclick=function(){
data.forEach(function(r){var o=r.on,x=Math.random();r.on=x<0.7?0:x<0.85?1:2;if(r.on&&!o)r.since=Date.now()});render()};
setInterval(function(){
data.forEach(function(r){if(r.on&&r.timer)r.timer.textContent=fmt(Date.now()-r.since)});
document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-GB");
},1000);
[["Kharkiv"],["Odesa"],["Kyiv Oblast"]].forEach(function(n){data.forEach(function(r){if(r.name===n[0]){r.on=n[0]==="Odesa"?2:1;r.since=Date.now()-Math.random()*600000}})});
render();
</script>
</body>
</html>
